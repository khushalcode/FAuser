name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Secret names below must match the names you created in
    # Settings -> Secrets and variables -> Actions. Rename the right-hand side if yours differ.
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.EXPO_PUBLIC_RAZORPAY_KEY_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @babel/core@7.24.7 --legacy-peer-deps --save-exact --no-save

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch expo-modules Gradle files
        run: |
          grep -rl "components.release" node_modules/expo-*/android node_modules/expo-modules-core/android --include=*.gradle 2>/dev/null | xargs -r sed -i 's|from components.release|// from components.release|g' || true
          find node_modules/expo-*/android/build.gradle -exec sed -i 's|compileSdkVersion safeExtGet|compileSdk safeExtGet|g; s|minSdkVersion safeExtGet|minSdk safeExtGet|g; s|targetSdkVersion safeExtGet|targetSdk safeExtGet|g' {} \; 2>/dev/null || true
          find node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle -exec sed -i 's|compileSdkVersion project.ext.safeExtGet|compileSdk project.ext.safeExtGet|g; s|minSdkVersion project.ext.safeExtGet|minSdk project.ext.safeExtGet|g; s|targetSdkVersion project.ext.safeExtGet|targetSdk project.ext.safeExtGet|g' {} \; 2>/dev/null || true

          python3 - <<'PY'
          import re, glob

          # Top-level ext block for expo modules that use safeExtGet
          with open('android/build.gradle') as f:
              c = f.read()
          if 'ndkVersion = ' not in c and not re.search(r'^ext \{', c, re.M):
              ext_block = "\n".join([
                  "// Top-level ext (needed for expo-modules which use safeExtGet)",
                  "ext {",
                  "    buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'",
                  "    minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')",
                  "    compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')",
                  "    targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')",
                  "    kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.24'",
                  "    ndkVersion = '26.1.10909125'",
                  "}",
                  "",
                  "",
              ])
              if '// Top-level build file' in c:
                  c = c.replace('// Top-level build file', ext_block + '// Top-level build file', 1)
              else:
                  c = ext_block + c
              with open('android/build.gradle', 'w') as f:
                  f.write(c)

          # Force compileSdk in expo modules
          pat = (r'(android \{)\s*// Remove this if[^\n]*\n  if \(!safeExtGet\("expoProvidesDefaultConfig", false\)\) \{\s*'
                 r'compileSdk safeExtGet\("compileSdkVersion", 34\)\s*defaultConfig \{\s*minSdk safeExtGet\("minSdkVersion", 23\)\s*'
                 r'targetSdk safeExtGet\("targetSdkVersion", 34\)\s*\}\s*publishing \{\s*singleVariant\("release"\) \{\s*withSourcesJar\(\)\s*\}\s*\}\s*'
                 r'lintOptions \{\s*abortOnError false\s*\}\s*\}')
          rep = r'\1\n  compileSdk 35\n  defaultConfig {\n    minSdk 24\n    targetSdk 34\n  }'
          for f in glob.glob('node_modules/expo-*/android/build.gradle'):
              with open(f) as fh:
                  c = fh.read()
              new = re.sub(pat, rep, c, flags=re.DOTALL)
              if new != c:
                  with open(f, 'w') as fh:
                      fh.write(new)
                  print('Fixed:', f)
          PY

          if ! grep -q "android.compileSdkVersion" android/gradle.properties; then
            cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=35
          android.targetSdkVersion=34
          android.minSdkVersion=24
          android.buildToolsVersion=35.0.0
          android.kotlinVersion=1.9.24
          EOF
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/foodmunch-customer-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodmunch-customer-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30
